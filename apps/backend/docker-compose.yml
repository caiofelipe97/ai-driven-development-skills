name: app-meu-projeto-backend-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: app-meu-projeto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_meu_projeto
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: app_meu_projeto_db
    ports:
      - '6071:5432'
    volumes:
      - app-meu-projeto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_meu_projeto']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-meu-projeto-postgres-data:
    driver: local
